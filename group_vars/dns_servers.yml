---
# Mot de passe admin Pi-hole (chargé depuis .env)
pihole_password: "{{ lookup('env', 'PIHOLE_PASSWORD') }}"

# Interface réseau écoutée par Pi-hole
pihole_interface: eth0

# Serveurs DNS upstream
pihole_dns_1: 8.8.8.8
pihole_dns_2: 8.8.4.4

# Taille du cache DNS
pihole_cache_size: 10000

# Enregistrements DNS personnalisés pour les services du homelab
dns_records:
  # Cluster Rancher (Gateway Traefik, IP MetalLB 192.168.1.131)
  - host: rancher.homelab.local
    ip: 192.168.1.131
  - host: argocd-rancher.homelab.local
    ip: 192.168.1.131
  # Cluster Payload (Gateway Traefik, IP MetalLB 192.168.1.133) — une entrée par HTTPRoute
  - host: vault.homelab.local
    ip: 192.168.1.133
  - host: harbor.homelab.local
    ip: 192.168.1.133
  - host: kafka.homelab.local
    ip: 192.168.1.133
  - host: gitlab.homelab.local
    ip: 192.168.1.133
  - host: adminer.homelab.local
    ip: 192.168.1.133
  - host: n8n.homelab.local
    ip: 192.168.1.133
  - host: phpipam.homelab.local
    ip: 192.168.1.133
  - host: argo.homelab.local
    ip: 192.168.1.133
  - host: longhorn.homelab.local
    ip: 192.168.1.133
  - host: prometheus.homelab.local
    ip: 192.168.1.133
  - host: grafana.homelab.local
    ip: 192.168.1.133
  - host: alertmanager.homelab.local
    ip: 192.168.1.133
  # VM standalone-1 (Floci, émulateur AWS : datacenter-floci)
  - host: floci.homelab.local
    ip: 192.168.1.120

# Wildcards (dnsmasq address=) : le domaine ET tous ses sous-domaines.
# Toute appli exposée par la Gateway Traefik du cluster Payload en
# <appli>.apps.homelab.local est résolue sans ajout ici (certificat :
# apps-wildcard-tls dans catalog-gitops-fluxcd).
dns_wildcards:
  - domain: apps.homelab.local
    ip: 192.168.1.133
